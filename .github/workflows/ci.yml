name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/test_feedback.mjs
      - run: node tests/test_cli_feedback.mjs
      - run: node tests/test_plan_engine.mjs
      - run: node tests/test_mcp_project.mjs
      - run: node tests/test_parity_project.mjs
      - run: node tests/test_workbuddy_recoscan.mjs
      # YQ-1154 T1 机闸挂载（G2 PII parity / G5 CONTRIBUTING 双用途）
      - run: node tests/test_pii_parity.mjs
      - run: node tests/test_contributing_feedback.mjs
